<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    
    <title>Loop Filter Control</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.0/math.js"></script>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="icon" type="image/x-icon" href="./images/favicon-32x32.png">
</head>
<body>
<div class="cover" id="cover" style="display: none;" onclick="document.getElementById('cover').style.display = 'none';">
    <div class="popup" onclick="event.stopPropagation()">
        <div class="popup-content">
            <h2>Charts Data</h2>
            <div id="popupInfo" style="max-height:600px; overflow-y: auto; margin-bottom: 20px;"></div>
            <button id="closePopupBtn" class="button" onclick="document.getElementById('cover').style.display = 'none';">Close</button>
        </div>
    </div>>
</div>
<div class="container">
    <div style="margin-bottom:5px;">

        <div class="custom-checkbox"><div>Connect</div>
            <input id="connect" class="status-input" type="checkbox" name="connect" tabindex="-1">
            <label for="connect"><div class="status-switch" data-unchecked="Off" data-checked="On"></div></label> 
        </div>
        <div class="custom-checkbox"><div>Predictor</div>
            <input id="predict" class="status-input" type="checkbox" name="predict" tabindex="-1">
            <label for="predict"><div class="status-switch" data-unchecked="Off" data-checked="On"></div></label> 
        </div>


        <button id="getVersionBtn" title="Get version description" class="button" style="float:right;">
            <svg width="32px" height="32px" viewBox="0 0 96 96" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><title>version-history</title><g id="Page-1" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd"><g id="version-history" fill="#000000"><g id="icon" transform="translate(6 8)"><path d="M49.654 0c19.884 0 36 16.116 36 36a36 36 0 0 1 -61.106 25.8l5.578 -5.733A27.998 27.998 0 1 0 21.657 36q0 1.139 0.089 2.25l7.912 -7.908L35.316 36l-17.658 17.658L0 36l5.658 -5.658 8.082 8.076a37.5 37.5 0 0 1 -0.085 -2.419A36 36 0 0 1 49.654 0M43.462 23.836l6.229 16.603 6.229 -16.603h8.546l-10.5 27.998h-8.545l-10.5 -27.998z" id="Combined-Shape"/></g></g></g></svg>
        </button>
        <button id="rebootBtn" title="Reboot device" class="button" style="float:right;">
            <svg width="32px" height="32px" viewBox="0 0 0.64 0.64" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"  stroke-width="0.01" ><path d="M0.32 0c-0.022 0 -0.04 0.018 -0.04 0.04v0.2c0 0.022 0.018 0.04 0.04 0.04s0.04 -0.018 0.04 -0.04V0.04c0 -0.022 -0.018 -0.04 -0.04 -0.04M0.04 0.04l0.082 0.082a0.28 0.28 0 0 0 -0.053 0.322 0.28 0.28 0 0 0 0.287 0.154 0.28 0.28 0 0 0 0.238 -0.222 0.28 0.28 0 0 0 -0.133 -0.297 0.04 0.04 0 0 0 -0.04 0.069 0.2 0.2 0 0 1 0.095 0.212 0.2 0.2 0 0 1 -0.17 0.159c-0.085 0.011 -0.167 -0.033 -0.205 -0.11s-0.023 -0.169 0.038 -0.23L0.24 0.24V0.08C0.24 0.059 0.222 0.04 0.2 0.04zm0 0" fill="#2e3436"/></svg>
        </button>
        <div style="display: inline-block;"><div id="connectionStatus">DISCONNECTED</div></div>
    </div>

    <div id="frameBoard" style="transition: transform 0.2s ease;" class="zoomedFrame">
        <img src="./images/fpga2R.png" alt="Loop Filter Control" style="position:absolute ; width:1200px; border-radius:8px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);">
        <canvas id="systemCanvas" width="1200" height="398" style="position: relative; width: 1200px; z-index:10;"></canvas>
        <div id="zBut" style="width:40px; height:40px; background-color: rgb(22, 25, 56); border:2px solid rgb(180, 177, 177); position: relative; bottom: 30px;
            z-index: 200; border-radius: 8px; padding:2px; " ><img id="imageScr", src="./images/sOpenB.png"/></div>
    </div>

    <div class="grid">
        <div class="card">
            <div class="controls">
                <div>
                    <label for="scopeSample1Select" style="color:green !important;">
                        <span style="flex: 3;">Scope 1</span>
                        <span id="scope1Abs" style="font-size: 20px; line-height: 12px;;">X</span>
                        <span id="scope1Domain" style="font-size: 20px; line-height: 12px;;">T</span>
                        <span id="scope1Sign" style="font-size: 32px; line-height: 12px;;">+</span>
                        <span id="scope1State" style="font-size: 32px; line-height: 12px;;">&#9632;</span></label>
                    <select id="scopeSample1Select" style="width: 260px;"></select>
                </div>
                <div>
                    <label for="scopeType1Select" style="color:green !important;">type</label>
                    <select id="scopeType1Select" style="width: 70px;"></select>
                </div>
                <div>
                    <label for="scopeSample2Select" style="color:blue !important;">
                        <span style="flex: 3;">Scope 2</span>
                        <span id="scope2Abs" style="font-size: 20px; line-height: 12px;;">X</span>
                        <span id="scope2Domain" style="font-size: 20px; line-height: 12px;;">T</span>
                        <span id="scope2Sign" style="font-size: 32px; line-height: 12px;;">+</span>
                        <span id="scope2State" style="font-size: 32px; line-height: 12px;;">&#9632;</span></label>
                    <select id="scopeSample2Select" style="width: 260px;"></select>
                </div>
                <div>
                    <label for="scopeType2Select" style="color:blue !important;">type</label>
                    <select id="scopeType2Select" style="width: 70px;"></select>
                </div>
                <div>
                    <label for="scopeAddSelect" style="color:rgb(48, 47, 47) !important;">Mix</label>
                    <select id="scopeAddSelect">
                        <option value="none">None</option>
                        <option value="sum">Sum</option>
                        <option value="diff">Diff</option> 
                    </select>
                </div>
                <div style="display: none;">
                    <label for="nSamples">Samples</label>
                    <input type="number" id="nSamples" value="512" min="10" max="3000" step="1" style="width:80px">
                </div>
                <div>
                    <label for="nScanInterval">Int</label>
                    <input type="number" id="nScanInterval" value="1" min="1" max="100" step="1" style="width:80px">
                </div>
                <button id="dataDisplayBtn" title="Data" class="button">
                   <svg fill="#000000" version="1.1" id="Layer_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="40px" height="40px" viewBox="0 0 3.5 3.5" enable-background="new 0 0 70 70" xml:space="preserve"><g><path d="m2.941 0.628 -0.499 -0.425c-0.038 -0.038 -0.078 -0.074 -0.131 -0.074H0.72c-0.11 0 -0.241 0.12 -0.241 0.23v2.8c0 0.11 0.08 0.17 0.191 0.17h2.15c0.11 0 0.159 -0.059 0.159 -0.17V0.769c0 -0.053 -0.001 -0.104 -0.038 -0.141m-0.139 0.102h-0.373V0.411zm-0.023 2.4h-2.1v-2.8h1.65v0.444c0 0.028 0.014 0.056 0.042 0.056h0.408z"/><path d="M2.479 1.079a0.05 0.05 0 0 0 -0.05 -0.05h-1.4a0.05 0.05 0 0 0 -0.05 0.05v1.55a0.05 0.05 0 0 0 0.05 0.05h1.4a0.05 0.05 0 0 0 0.05 -0.05zm-1 1.2v-0.2h0.65v0.2zm0.65 0.1v0.2h-0.65v-0.2zm0 -0.4h-0.65v-0.25h0.65zm0.1 -0.25h0.15v0.25h-0.15zm-0.85 0.25h-0.3v-0.25h0.3zm-0.3 -0.35v-0.2h0.3v0.2zm0 0.45h0.3v0.2h-0.3zm1.15 0h0.15v0.2h-0.15zm0.15 -0.45h-0.15v-0.2h0.15zm-0.25 0h-0.65v-0.2h0.65zm-0.65 -0.3v-0.2h0.65v0.2zm-0.1 -0.2v0.2h-0.3v-0.2zm-0.3 1.25h0.3v0.2h-0.3zm1.15 0.2v-0.2h0.15v0.2zm0.15 -1.25h-0.15v-0.2h0.15z"/></g></svg>
                </button>
                <div>
                    <label for="scopeSample3Select" style="color:red !important;">
                        <span style="flex: 3;">Scope 3</span>
                        <span id="scope3Abs" style="font-size: 20px; line-height: 12px;;">X</span>
                        <span id="scope3Domain" style="font-size: 20px; line-height: 12px;;">T</span>
                        <span id="scope3Sign" style="font-size: 32px; line-height: 12px;;">+</span>
                        <span id="scope3State" style="font-size: 32px; line-height: 12px;;">&#9633;</span></label>
                    <select id="scopeSample3Select" style="width: 260px; " disabled></select>
                </div>
                <div>
                    <label for="scopeType3Select" style="color:red !important;">type</label>
                    <select id="scopeType3Select" style="width: 70px;"></select>
                </div>
                <div>
                    <label for="scopeSample4Select" style="color:orange !important;">
                        <span style="flex: 3;">Scope 4</span>
                        <span id="scope4Abs" style="font-size: 20px; line-height: 12px;;">X</span>
                        <span id="scope4Domain" style="font-size: 20px; line-height: 12px;;">T</span>
                        <span id="scope4Sign" style="font-size: 32px; line-height: 12px;;">+</span>
                        <span id="scope4State" style="font-size: 32px; line-height: 12px;;">&#9633;</span></label>  
                    <select id="scopeSample4Select" style="width: 260px;" disabled></select>
                </div>
                <div>
                    <label for="scopeType4Select" style="color:orange !important;">type</label>
                    <select id="scopeType4Select" style="width: 70px;"></select>
                </div>
                <div class="custom-checkbox"><div>Scope</div>
                    <input id="scope" class="status-input" type="checkbox" name="scope" tabindex="-1">
                    <label for="scope"><div class="status-switch" data-unchecked="Off" data-checked="On"></div></label> 
                </div>               
                <div>
                    <label for="trigger" style="color:rgb(48, 47, 47) !important;">Trigger</label>
                    <input type="checkbox" id="trigger">
                </div>
                <div>
                    <label for="scaleLock" style="color:rgb(48, 47, 47) !important;">SLock</label>
                    <input type="checkbox" id="scaleLock">
                </div>
                <div>
                    <label for="unifiedLock" style="color:rgb(48, 47, 47) !important;">ULock</label>
                    <input type="checkbox" id="unifiedLock">
                </div>
                <div>
                    <label for="scaleChase" style="color:rgb(48, 47, 47) !important;">Chase</label>
                    <input type="checkbox" id="scaleChase">
                </div>
                <div style="display:none;">
                    <label for="timer" style="color:rgb(48, 47, 47) !important;">Timer</label>
                    <input type="checkbox" id="timer">
                </div>
            </div>
            <div style="margin-top: 20px;">
                <canvas id="scopeCanvas" width="1158" height="300" 
                style="width: 100%; height: 300px; background:#ecedee; border-radius:8px; cursor: crosshair;"
                ></canvas>
            </div>
            <div>
                <div id="ch1Ptp" class="chData">0</div><div id="ch1Mean" class="chData">0</div>
                <div id="ch2Ptp" class="chData">0</div><div id="ch2Mean" class="chData">0</div>
                <div id="ch3Ptp" class="chData">0</div><div id="ch3Mean" class="chData">0</div>
                <div id="ch4Ptp" class="chData">0</div><div id="ch4Mean" class="chData">0</div>
            </div>
        </div>
        <div class="card">
            <div class="controls" style="display:inline-flex; vertical-align:top;">
                <div><label for="paramOrder">Order</label><input type="number" id="paramOrder" value="2" min="1" step="1"></div>
                <div><label for="paramAlpha">&alpha; (0-5)</label><input type="number" id="paramAlpha" value="0.0" min="0" step="0.5"></div>
                <div><label for="paramPGain">P Gain</label><input type="number" id="paramPGain" value="1.0" min="-100.0" step="0.25" style="width: 100px;"></div>
                <div><label for="paramPiCorner">PI corner (KHz)</label><input type="number" id="paramPiCorner" value="0.0" min="0.0" step="0.0000001" style="width: 120px;"></div>
                <div><label for="paramAveragingTimer">Avg time (ns)</label><input type="number" id="paramAveragingTimer" value="20" min="20" step="20" style="width: 80px;"></div>
            </div>
            <div style="display:inline-block;height:20px; width:10px;"></div>

            <div class="controls" style="display:inline-flex; width:580px">
                <div class="custom-checkbox" style="padding-top:3px;"><div>Scan</div>
                    <input id="scan" class="status-input" type="checkbox" name="scan" tabindex="-1">
                    <label for="scan"><div class="status-switch" data-unchecked="Off" data-checked="On"></div></label> 
                </div>
                <div><label for="paramScanFrequency">Frequency</label><input type="number" id="paramScanFrequency" value="10" min="0" step="1" style="width: 70px;"></div>
                <div><label for="paramScanAmplitude">Amplitude</label><input type="number" id="paramScanAmplitude" value="8192" min="0" step="1" style="width: 80px;"></div>
                <div><label for="paramScanOffset">Offset</label><input type="number" id="paramScanOffset" value="0" min="0" step="1" style="width: 80px;"></div>
                <div>
                    <label for="paramScanType">Type</label>
                    <select id="paramScanType"><option value="2">Triangle</option><option value="1">Saw Tooth</option><option value="0">None</option></select>
                </div>            </div>
            <div style="height:20px;"></div>
            <div class="controls" style="display:inline-flex; width:450px;">
                <div><label for="paramInputOffset">In offset</label><input type="number" id="paramInputOffset" value="0" min="-10000" step="20" style="width: 100px;"></div>
                <div><label for="paramOutputOffset1">Out offset 1</label><input type="number" id="paramOutputOffset1" value="0" min="-10000" step="20" style="width: 100px;"></div>
                <div><label for="paramOutputOffset2">Out offset 2</label><input type="number" id="paramOutputOffset2" value="0" min="-10000" step="20" style="width: 100px;"></div>
                <div><label for="paramOutputShift">Output shift</label><input type="number" id="paramOutputShift" value="0" min="0" max="63" step="1" style="width: 80px;"></div>
                <div><label for="paramIntegratorShift">Integ. shift</label><input type="number" id="paramIntegratorShift" value="0" min="0" step="1" style="width: 80px;"></div>
                <div><label for="paramIntegrator2Shift">Integ2. shift</label><input type="number" id="paramIntegrator2Shift" value="0" min="0" step="1" style="width: 80px;"></div>
                <div><label for="paramIntegrator2Gain">Integ2. gain</label><input type="number" id="paramIntegrator2Gain" value="0" min="0" step="0.1" style="width: 80px;"></div>
            </div>
            <div style="display:inline-block;height:20px; width:10px;"></div>
            <div class="controls" style="display:inline-flex; width:500px;">
                <div>
                    <label for="inputSelect">Input</label>
                    <select id="inputSelect"><option value="0">A</option><option value="1">B</option><option value="2">A - B</option></select>
                </div>
                <div>
                    <label for="inputFunctionSelect">Input function</label>
                    <select id="inputFunctionSelect"><option value="0">X</option><option value="1">Abs(X)</option></select>
                </div>
                <div>
                    <label for="Int2IsOnSelect">Integ 2</label>
                    <select id="Int2IsOnSelect"><option value="0">Off</option><option value="1">On</option></select>
                </div>
                <div>
                    <label for="modeSelect">Running mode</label>
                    <select id="modeSelect"><option value="normal">Normal</option><option value="sawtooth">Scan</option></select>
                </div>
                <div>
                    <label for="DitherSelect">Dither</label>
                    <select id="DitherSelect"><option value="0">Off</option><option value="1">In</option><option value="2">Out</option><option value="3">On</option></select>
                </div>
                <div><label for="paramDitherOutputAmpliture">Dither amplitude</label><input type="number" id="paramDitherOutputAmpliture" value="10" min="0" step="1" style="width: 80px;"></div>
                <div><label for="paramDitherInputPhase">Dither phase</label><input type="number" id="paramDitherInputPhase" value="0" min="0" max="360" step="1" style="width: 80px;"></div>
                <div><label for="paramDitherInputPolarity">Dither polarity</label><input type="number" id="paramDitherInputPolarity" value="0" min="0" max="1" step="1" style="width: 80px;"></div>
                <div>
                    <label for="output2Select" style="color:red !important;">Second output</label>
                    <select id="output2Select"></select>
                </div>

            </div>    
        </div>
        <div class="card" style="min-height: 200px;">
            <button id="dumpBtn" title="Dump registers content" class="button">
                <svg version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px" viewBox="0 0 32 32" style="enable-background:new 0 0 310 310;" xml:space="preserve" width="32" height="32"><path d="m31.03 16.488 -4.679 -4.679c-0.605 -0.605 -1.585 -0.605 -2.19 0l-0.935 0.935V1.548C23.226 0.693 22.533 0 21.678 0H2.064C1.209 0 0.516 0.693 0.516 1.548v24.774c0 0.855 0.693 1.548 1.548 1.548h8.774v2.581c0 0.855 0.693 1.548 1.548 1.548h4.679a1.548 1.548 0 0 0 1.095 -0.454l12.869 -12.869c0.605 -0.605 0.605 -1.585 0 -2.19M3.613 3.097h16.516v12.744l-8.837 8.837a1.524 1.524 0 0 0 -0.088 0.097H3.613zm12.812 25.806H13.936v-2.49l11.321 -11.32 2.49 2.49z"/></svg>
            </button>
            <pre id="dumpOutput" class="info"></pre>
        </div>
        <div class="card" style="min-height: 200px;">
            <div id="log"></div>
        </div>    
    </div>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
